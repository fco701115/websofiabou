version: '3.8'

services:
  app:
    build: .
    container_name: websofiabou
    restart: always
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DB_HOST=postgres
      - DB_NAME=websofiabou
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - DB_PORT=5432
    depends_on:
      - postgres
    networks:
      - websofiabou-net

  postgres:
    image: postgres:16-alpine
    container_name: websofiabou-db
    restart: always
    environment:
      - POSTGRES_DB=websofiabou
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-123456}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - websofiabou-net

networks:
  websofiabou-net:
    driver: bridge

volumes:
  pgdata:
